name: Сборка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: pc/go.mod

      - name: Тесты ПК-программы
        working-directory: pc
        run: go vet ./... && go test ./...

      - name: Сборка USBDisplay.exe (APK встраивается внутрь)
        working-directory: pc
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cp ../android/app/build/outputs/apk/release/app-release.apk apk/usbdisplay.apk
          mkdir -p ../dist
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.apkVersion=${{ github.run_number }}" -o ../dist/USBDisplay.exe .

      - name: Упаковка
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dist/USBDisplay.apk
          cp README.md dist/
          cd dist && zip -9 "../USBDisplay-v2.0.${{ github.run_number }}.zip" USBDisplay.exe USBDisplay.apk README.md

      - uses: actions/upload-artifact@v4
        with:
          name: USBDisplay-v2.0.${{ github.run_number }}
          path: dist/

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2.0.${{ github.run_number }}"
          gh release create "$tag" "USBDisplay-$tag.zip" dist/USBDisplay.exe dist/USBDisplay.apk \
            --title "USB Display $tag" --latest \
            --notes "Скачайте USBDisplay-$tag.zip, распакуйте и запустите USBDisplay.exe. Приложение для Android встроено и ставится на устройство само при подключении кабеля."
